name: Daily Tech X Drafts

on:
  schedule:
    # UTC times corresponding to 9:15 AM, 11:30 AM, 2:10 PM, 7:20 PM, 9:45 PM IST
    - cron: "45 3 * * *"
    - cron: "0 6 * * *"
    - cron: "40 8 * * *"
    - cron: "50 13 * * *"
    - cron: "15 16 * * *"
  workflow_dispatch: # Allows you to trigger a test run manually anytime

permissions:
  contents: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pick post style for this run
        # 11:30 AM and 2:10 PM IST runs ask a question instead of a statement.
        # github.event.schedule holds the exact cron string that fired this run
        # (empty for a manual workflow_dispatch run, which defaults to statement).
        run: |
          if [ "${{ github.event.schedule }}" = "0 6 * * *" ] || [ "${{ github.event.schedule }}" = "40 8 * * *" ]; then
            echo "POST_STYLE=question" >> "$GITHUB_ENV"
          else
            echo "POST_STYLE=statement" >> "$GITHUB_ENV"
          fi

      - name: Run curator bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POST_STYLE: ${{ env.POST_STYLE }}
        run: python bot.py

      - name: Save posted article history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted news history" && git push)
