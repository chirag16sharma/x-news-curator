name: Daily Tech X Drafts

on:
  schedule:
    # UTC times corresponding to 9:15 AM, 11:30 AM, 2:10 PM, 7:20 PM, 9:45 PM IST
    - cron: "45 3 * * *"
    - cron: "0 6 * * *"
    - cron: "40 8 * * *"
    - cron: "50 13 * * *"
    - cron: "15 16 * * *"
  workflow_dispatch: # Allows you to trigger a test run manually anytime

permissions:
  contents: write

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pick post style for this run
        # 9:15 AM IST opens a discussion thread (open-ended question).
        # 11:30 AM and 2:10 PM IST ask one sharp pointed question.
        # Everything else (incl. manual workflow_dispatch) is a statement.
        # github.event.schedule holds the exact cron string that fired this run.
        run: |
          if [ "${{ github.event.schedule }}" = "45 3 * * *" ]; then
            echo "POST_STYLE=discussion" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ] || [ "${{ github.event.schedule }}" = "40 8 * * *" ]; then
            echo "POST_STYLE=question" >> "$GITHUB_ENV"
          else
            echo "POST_STYLE=statement" >> "$GITHUB_ENV"
          fi

      - name: Run curator bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POST_STYLE: ${{ env.POST_STYLE }}
        run: python bot.py

      - name: Save posted article history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f last_posted_link.txt ]; then
            echo "No article was posted this run, nothing to save."
            exit 0
          fi

          # 5 runs/day means two runs can land close together and race on
          # pushing history.json. Each attempt resets to the latest remote
          # history.json and merges in just this run's URL (via last_posted_link.txt,
          # written by bot.py), instead of trying to rebase/patch a JSON diff
          # against whatever another run already pushed.
          for i in 1 2 3 4 5; do
            git fetch origin main
            # last_posted_link.txt is untracked, so --hard reset to the latest
            # remote history.json doesn't touch it.
            git reset --hard origin/main

            python3 scripts/merge_history.py

            git add history.json
            if git diff --staged --quiet; then
              echo "History already up to date."
              exit 0
            fi
            git commit -m "Update posted news history"

            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $i/5), retrying..."
            sleep $((RANDOM % 8 + 1))
          done

          echo "Could not push history.json after retries." >&2
          exit 1
